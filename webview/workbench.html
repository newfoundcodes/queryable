<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{CSP_SOURCE}} data:; font-src {{CSP_SOURCE}}; style-src {{CSP_SOURCE}} 'unsafe-inline'; script-src {{CSP_SOURCE}} 'nonce-{{NONCE}}' 'unsafe-eval'; worker-src {{CSP_SOURCE}} blob:;"
    />
    <title>{{TITLE}}</title>
    <style nonce="{{NONCE}}">
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        color: var(--vscode-editor-foreground);
        background: var(--vscode-editor-background);
        font-family: var(--vscode-font-family);
        font-size: var(--vscode-font-size);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 1px solid var(--vscode-focusBorder);
        outline-offset: -1px;
      }
      .workbench {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
      }
      .explorer {
        min-width: 0;
        border-right: 1px solid var(--vscode-panel-border);
        background: var(--vscode-sideBar-background);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .explorer-head {
        padding: 8px;
        border-bottom: 1px solid var(--vscode-panel-border);
      }
      .explorer-title-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 7px;
      }
      .explorer-title {
        min-width: 0;
        flex: 1;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icon-action {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 3px;
        color: var(--vscode-icon-foreground, var(--vscode-foreground));
        background: transparent;
        cursor: pointer;
      }
      .icon-action:hover {
        background: var(--vscode-toolbar-hoverBackground, var(--vscode-list-hoverBackground));
      }
      .icon-action:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .icon-action svg {
        width: 14px;
        height: 14px;
      }
      select,
      input {
        color: var(--vscode-input-foreground);
        background: var(--vscode-input-background);
        border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
        padding: 4px 6px;
      }
      select {
        width: 100%;
      }
      .object-browser {
        min-height: 0;
        flex: 1;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
      }
      .object-browser.no-tabs {
        grid-template-rows: auto minmax(0, 1fr);
      }
      .object-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--vscode-panel-border);
        background: var(--vscode-sideBarSectionHeader-background);
      }
      .object-tab {
        min-width: 0;
        height: 30px;
        border: 0;
        border-right: 1px solid var(--vscode-panel-border);
        background: transparent;
        color: var(--vscode-sideBarSectionHeader-foreground);
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 0 7px;
      }
      .object-tab:last-child {
        border-right: 0;
      }
      .object-tab.active {
        background: var(--vscode-tab-activeBackground);
        color: var(--vscode-tab-activeForeground);
        box-shadow: inset 0 -1px 0 var(--vscode-focusBorder);
      }
      .object-tab:hover {
        background: var(--vscode-list-hoverBackground);
      }
      .object-search {
        padding: 7px;
        border-bottom: 1px solid var(--vscode-panel-border);
      }
      .object-search input {
        width: 100%;
      }
      .object-scroll {
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 0;
      }
      .object-list {
        padding: 3px 0;
      }
      .object-button {
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--vscode-foreground);
        padding: 4px 9px 4px 14px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .object-button:hover {
        background: var(--vscode-list-hoverBackground);
      }
      .empty {
        color: var(--vscode-descriptionForeground);
        padding: 7px 10px;
      }
      .right {
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-rows: minmax(0, 1fr) 230px;
        overflow: hidden;
      }
      .content-area {
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-rows: 34px minmax(0, 1fr);
        overflow: hidden;
      }
      .tabs {
        display: flex;
        min-width: 0;
        margin: 0;
        padding: 0;
        overflow-x: auto;
        overflow-y: hidden;
        border-bottom: 1px solid var(--vscode-panel-border);
        background: var(--vscode-editorGroupHeader-tabsBackground);
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        min-width: 110px;
        max-width: 240px;
        border: 0;
        border-right: 1px solid var(--vscode-tab-border, var(--vscode-panel-border));
        color: var(--vscode-tab-inactiveForeground);
        background: var(--vscode-tab-inactiveBackground);
        cursor: pointer;
      }
      .tab.active {
        color: var(--vscode-tab-activeForeground);
        background: var(--vscode-tab-activeBackground);
        border-top: 1px solid var(--vscode-tab-activeBorderTop, transparent);
      }
      .tab-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .tab-close {
        opacity: 0.8;
      }
      .content {
        min-width: 0;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .placeholder {
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--vscode-descriptionForeground);
      }
      .table-pane,
      .result-pane {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      .table-tools {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px;
        border-bottom: 1px solid var(--vscode-panel-border);
      }
      .table-tools input {
        min-width: 160px;
        max-width: 420px;
        flex: 1;
      }
      .secondary,
      .primary {
        border: 1px solid var(--vscode-button-border, transparent);
        padding: 5px 9px;
        cursor: pointer;
      }
      .secondary {
        background: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }
      .secondary:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }
      .primary {
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
      }
      .primary:hover {
        background: var(--vscode-button-hoverBackground);
      }
      .primary:disabled,
      .secondary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .grid-scroll {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: scroll;
        scrollbar-gutter: stable;
      }
      .grid-scroll::-webkit-scrollbar,
      .object-scroll::-webkit-scrollbar,
      .tabs::-webkit-scrollbar,
      .modal-body::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }
      .grid-scroll::-webkit-scrollbar-thumb,
      .object-scroll::-webkit-scrollbar-thumb,
      .tabs::-webkit-scrollbar-thumb,
      .modal-body::-webkit-scrollbar-thumb {
        background: var(--vscode-scrollbarSlider-background);
      }
      .grid-scroll::-webkit-scrollbar-thumb:hover,
      .object-scroll::-webkit-scrollbar-thumb:hover,
      .tabs::-webkit-scrollbar-thumb:hover,
      .modal-body::-webkit-scrollbar-thumb:hover {
        background: var(--vscode-scrollbarSlider-hoverBackground);
      }
      .grid-scroll::-webkit-scrollbar-thumb:active,
      .object-scroll::-webkit-scrollbar-thumb:active,
      .tabs::-webkit-scrollbar-thumb:active,
      .modal-body::-webkit-scrollbar-thumb:active {
        background: var(--vscode-scrollbarSlider-activeBackground);
      }
      table {
        border-collapse: collapse;
        min-width: 100%;
        width: max-content;
      }
      th,
      td {
        border-right: 1px solid var(--vscode-panel-border);
        border-bottom: 1px solid var(--vscode-panel-border);
        padding: 5px 8px;
        text-align: left;
        max-width: 520px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: pre;
      }
      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--vscode-editorGroupHeader-tabsBackground);
        font-weight: 600;
      }
      tr:hover td {
        background: var(--vscode-list-hoverBackground);
      }
      td.editable-cell {
        cursor: text;
      }
      .pager {
        min-width: 0;
        padding: 6px 8px;
        border-top: 1px solid var(--vscode-panel-border);
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: flex-end;
        color: var(--vscode-descriptionForeground);
      }
      .procedure-pane {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }
      .editor-fill {
        width: 100%;
        height: 100%;
      }
      .procedure-fallback {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 8px 10px;
        resize: none;
        border: 0;
        border-radius: 0;
        outline: none;
        color: var(--vscode-editor-foreground);
        background: var(--vscode-editor-background);
        font-family: var(--vscode-editor-font-family);
        font-size: var(--vscode-editor-font-size);
        line-height: 1.45;
      }
      .terminal {
        border-top: 1px solid var(--vscode-panel-border);
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: 32px minmax(0, 1fr);
      }
      .terminal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 7px;
        background: var(--vscode-panel-background);
      }
      .terminal-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
      }
      .terminal-actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .query-editor-stack {
        position: relative;
        min-height: 0;
        width: 100%;
        height: 100%;
      }
      #queryEditor,
      #queryFallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
      }
      #queryEditor {
        display: none;
      }
      #queryEditor.ready {
        display: block;
      }
      #queryFallback {
        resize: none;
        border: 0;
        border-radius: 0;
        outline: none;
        padding: 8px 10px;
        color: var(--vscode-editor-foreground);
        background: var(--vscode-editor-background);
        font-family: var(--vscode-editor-font-family);
        font-size: var(--vscode-editor-font-size);
        line-height: 1.45;
        tab-size: 2;
      }
      #queryFallback[hidden] {
        display: none;
      }
      .result-summary {
        padding: 7px 9px;
        border-bottom: 1px solid var(--vscode-panel-border);
        color: var(--vscode-descriptionForeground);
      }
      .result-set {
        min-width: 0;
        min-height: 360px;
        margin-bottom: 12px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      .result-set.single-result {
        min-height: 0;
        height: 100%;
        margin-bottom: 0;
      }
      .result-label {
        padding: 6px 8px;
        font-weight: 600;
        background: var(--vscode-editorGroupHeader-tabsBackground);
        border-bottom: 1px solid var(--vscode-panel-border);
      }
      .result-scroll {
        min-width: 0;
        min-height: 0;
        overflow: auto;
      }
      .result-scroll.single-result {
        height: 100%;
        overflow: hidden;
      }
      .busy {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 30;
        padding: 7px 10px;
        border: 1px solid var(--vscode-notifications-border, var(--vscode-panel-border));
        background: var(--vscode-notifications-background);
        color: var(--vscode-notifications-foreground);
        display: none;
      }
      .busy.show {
        display: block;
      }
      .error {
        position: fixed;
        left: 275px;
        right: 12px;
        bottom: 12px;
        z-index: 31;
        padding: 8px 10px;
        border: 1px solid var(--vscode-inputValidation-errorBorder);
        background: var(--vscode-inputValidation-errorBackground);
        color: var(--vscode-inputValidation-errorForeground);
        display: none;
      }
      .error.show {
        display: block;
      }
      .movable-dialog {
        position: fixed;
        inset: auto;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 0;
        resize: both;
        overflow: hidden;
        border: 1px solid var(--vscode-panel-border);
        background: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        box-shadow: 0 6px 24px var(--vscode-widget-shadow);
      }
      .movable-dialog::backdrop {
        background: color-mix(in srgb, var(--vscode-editor-background) 55%, transparent);
      }
      .cell-dialog {
        width: min(720px, calc(100vw - 32px));
        height: min(520px, calc(100vh - 32px));
        min-width: 360px;
        min-height: 260px;
        max-width: calc(100vw - 8px);
        max-height: calc(100vh - 8px);
      }
      .confirm-dialog {
        width: min(420px, calc(100vw - 32px));
        min-width: 300px;
        max-width: calc(100vw - 8px);
      }
      .modal-layout {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      .modal-head {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px;
        border-bottom: 1px solid var(--vscode-panel-border);
        background: var(
          --vscode-titleBar-activeBackground,
          var(--vscode-editorGroupHeader-tabsBackground)
        );
        color: var(--vscode-titleBar-activeForeground, var(--vscode-foreground));
        cursor: move;
        user-select: none;
      }
      .modal-title {
        min-width: 0;
        flex: 1;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .modal-body {
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 10px;
      }
      .cell-editor-stack {
        width: 100%;
        height: 100%;
        min-height: 180px;
        position: relative;
        border: 1px solid var(--vscode-panel-border);
      }
      #cellEditor,
      #cellFallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #cellEditor {
        display: none;
      }
      #cellEditor.ready {
        display: block;
      }
      #cellFallback {
        resize: none;
        border: 0;
        outline: none;
        padding: 8px 10px;
        color: var(--vscode-editor-foreground);
        background: var(--vscode-editor-background);
        font-family: var(--vscode-editor-font-family);
        font-size: var(--vscode-editor-font-size);
      }
      #cellFallback[hidden] {
        display: none;
      }
      .modal-note {
        margin-bottom: 8px;
        color: var(--vscode-descriptionForeground);
        font-size: 11px;
      }
      .modal-note.warning {
        color: var(--vscode-inputValidation-warningForeground, var(--vscode-descriptionForeground));
      }
      .modal-actions {
        padding: 8px 10px;
        border-top: 1px solid var(--vscode-panel-border);
        display: flex;
        justify-content: flex-end;
        gap: 7px;
        background: var(--vscode-editor-background);
      }
      .confirm-body {
        padding: 14px;
        line-height: 1.45;
      }
      @media (max-width: 720px) {
        .workbench {
          grid-template-columns: 200px minmax(0, 1fr);
        }
        .error {
          left: 212px;
        }
        .terminal-actions #queryHint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="workbench">
      <aside class="explorer">
        <div class="explorer-head">
          <div class="explorer-title-row">
            <div class="explorer-title">{{TITLE}}</div>
            <button
              class="icon-action"
              id="refreshMetadata"
              type="button"
              title="Refresh database objects"
              disabled
              aria-label="Refresh database objects"
            >
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path
                  d="M13.3 4.7A6 6 0 1 0 14 8"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <path
                  d="M10.5 4.7h2.8V1.9"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <select id="schemaSelect" aria-label="Schema" disabled>
            <option>Loading…</option>
          </select>
        </div>
        <div class="object-browser{{ROUTINE_CLASS}}">
          {{ROUTINE_TABS}}
          <div class="object-search">
            <input
              id="objectSearch"
              type="search"
              placeholder="Search tables…"
              aria-label="Search database objects"
            />
          </div>
          <div class="object-scroll">
            <div class="object-list" id="tables"><div class="empty">Loading…</div></div>
            <div class="object-list" id="procedures" hidden><div class="empty">Loading…</div></div>
          </div>
        </div>
      </aside>
      <main class="right">
        <section class="content-area">
          <div class="tabs" id="tabs"></div>
          <div class="content" id="content">
            <div class="placeholder">Open a table, routine, or run a query.</div>
          </div>
        </section>
        <section class="terminal">
          <div class="terminal-head">
            <div class="terminal-title">Query</div>
            <div class="terminal-actions">
              <span id="queryHint">Ctrl+Enter to run</span
              ><button class="primary" id="runQuery" type="button">Run</button
              ><button class="secondary" id="runQueryNewTab" type="button">Run (New Tab)</button>
            </div>
          </div>
          <div class="query-editor-stack">
            <textarea
              id="queryFallback"
              spellcheck="false"
              aria-label="SQL query editor"
            ></textarea>
            <div id="queryEditor"></div>
          </div>
        </section>
      </main>
    </div>
    <dialog id="cellDialog" class="movable-dialog cell-dialog">
      <div class="modal-layout">
        <div class="modal-head" id="cellDialogHandle">
          <div class="modal-title" id="cellDialogTitle">Edit cell</div>
          <button class="icon-action" id="closeCellDialog" type="button" aria-label="Close">
            ×
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-note" id="cellDialogNote"></div>
          <div class="cell-editor-stack">
            <textarea id="cellFallback" spellcheck="false" aria-label="Cell value"></textarea>
            <div id="cellEditor"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="secondary" id="cancelCell" type="button">Cancel</button
          ><button class="primary" id="saveCell" type="button">Save</button>
        </div>
      </div>
    </dialog>
    <dialog id="keepChangesDialog" class="movable-dialog confirm-dialog">
      <div class="modal-layout" style="height: auto">
        <div class="modal-head" id="keepDialogHandle">
          <div class="modal-title">Keep the changes?</div>
          <button class="icon-action" id="closeKeepDialog" type="button" aria-label="Close">
            ×
          </button>
        </div>
        <div class="confirm-body">The cell has unsaved changes. Save them before closing?</div>
        <div class="modal-actions">
          <button class="secondary" id="discardCellChanges" type="button">Discard</button
          ><button class="secondary" id="keepEditingCell" type="button">Keep Editing</button
          ><button class="primary" id="saveCellChanges" type="button">Save</button>
        </div>
      </div>
    </dialog>
    <div class="busy" id="busy"></div>
    <div class="error" id="error"></div>
    <script nonce="{{NONCE}}" src="{{MONACO_ROOT}}/vs/loader.js"></script>
    <script nonce="{{NONCE}}">
      const vscode = acquireVsCodeApi();
      const tabs = new Map();
      let activeKey = '';
      let metadata = { schemas: [], tables: [], procedures: [], selectedSchema: '' };
      let activeObjectMode = 'tables';
      let queryEditor = null;
      let cellEditor = null;
      let monacoApi = null;
      let cellState = null;
      let cellSavePending = false;
      let activeExportTarget = null;
      let errorTimer = 0;
      const tabsNode = document.getElementById('tabs');
      const contentNode = document.getElementById('content');
      const schemaSelect = document.getElementById('schemaSelect');
      const tablesNode = document.getElementById('tables');
      const proceduresNode = document.getElementById('procedures');
      const objectSearch = document.getElementById('objectSearch');
      const busyNode = document.getElementById('busy');
      const errorNode = document.getElementById('error');
      const refreshMetadataButton = document.getElementById('refreshMetadata');
      const queryFallback = document.getElementById('queryFallback');
      const queryEditorNode = document.getElementById('queryEditor');
      const cellDialog = document.getElementById('cellDialog');
      const cellDialogTitle = document.getElementById('cellDialogTitle');
      const cellDialogNote = document.getElementById('cellDialogNote');
      const cellFallback = document.getElementById('cellFallback');
      const cellEditorNode = document.getElementById('cellEditor');
      const saveCellButton = document.getElementById('saveCell');
      const keepChangesDialog = document.getElementById('keepChangesDialog');

      initializeMonaco();
      makeDialogMovable(cellDialog, document.getElementById('cellDialogHandle'));
      makeDialogMovable(keepChangesDialog, document.getElementById('keepDialogHandle'));

      function initializeMonaco() {
        if (typeof require !== 'function') {
          showError('Monaco Editor could not be loaded. The fallback editors are active.');
          return;

        } else if (message.command === 'cellSaved') {
          if (cellState && cellState.editId === message.editId) closeCellEditor();
        } else if (message.command === 'queryResult') {
          const existing = tabs.get(message.id);
          const previousSizes =
            existing && existing.kind === 'result' && Array.isArray(existing.state.resultPageSizes)
              ? existing.state.resultPageSizes
              : [];
          openTab(message.id, message.title, 'result', {
            result: message.result,
            resultPages: message.result.resultSets.map(() => 1),
            resultPageSizes: message.result.resultSets.map(
              (set, index) => Number(previousSizes[index]) || 50,
            ),
          });
        } else if (message.command === 'exportRequested') {
          if (!activeExportTarget)
            showError('Select an Export button from a table or query result first.');
          else
            vscode.postMessage({
              command: 'exportData',
              format: message.format,
              target: activeExportTarget,
            });
        } else if (message.command === 'busy') {
          busyNode.textContent = message.label;
          busyNode.classList.toggle('show', message.value);
        } else if (message.command === 'error') {
          refreshMetadataButton.disabled = false;
          if (cellSavePending) {
            cellSavePending = false;
            saveCellButton.disabled = !cellState || !cellState.editable;
          }
          showError(message.message);
        }
      });

      vscode.postMessage({ command: 'ready' });
    </script>
  </body>
</html>
