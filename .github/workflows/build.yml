name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build.yml'
      - '.npmrc'
      - '.vscodeignore'
      - 'media/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'webview/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.npmrc'
      - '.vscodeignore'
      - 'media/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'webview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vsix:
    name: VSIX / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: win32-x64
            os: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      # The prebuilt sqlite3 binary for linux-x64 is linked against glibc 2.38 and libstdc++ 3.4.31,
      # which ubuntu-22.04 (glibc 2.35) cannot load. Compiling it here ties the VSIX to the older
      # glibc instead, so it also runs on Ubuntu 22.04, Debian 12 and RHEL 9.
      - name: Build sqlite3 from source for linux-x64
        if: matrix.target == 'linux-x64'
        run: |
          npm rebuild sqlite3 --build-from-source

          # Keep only the loadable binary. Object files and gyp output would otherwise be
          # packed into the VSIX; the prebuilt download on other targets contains just this file.
          find node_modules/sqlite3/build -mindepth 1 -maxdepth 1 ! -name Release -exec rm -rf {} +
          find node_modules/sqlite3/build/Release -mindepth 1 -maxdepth 1 ! -name node_sqlite3.node -exec rm -rf {} +
          ls -la node_modules/sqlite3/build/Release

      - name: Verify native modules for ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node - <<'EOF'
          const fs = require('node:fs');
          const target = process.env.TARGET;

          // Guards against a matrix entry whose runner does not match its declared target.
          const actual = `${process.platform}-${process.arch}`;
          if (actual !== target) {
            console.error(`Runner is ${actual} but this job packages ${target}.`);
            process.exit(1);
          }

          // Each of these is installed per platform; if one is missing the VSIX would install
          // but fail at runtime when the matching database is used.
          const required = [
            `node_modules/@duckdb/node-bindings-${target}`,
            'node_modules/sqlite3/build/Release/node_sqlite3.node',
            'node_modules/ibm_db/build/Release/odbc_bindings.node',
            'node_modules/ibm_db/installer/clidriver',
          ];
          const missing = required.filter((entry) => !fs.existsSync(entry));
          if (missing.length > 0) {
            console.error(`Missing native files for ${target}:\n  ${missing.join('\n  ')}`);
            process.exit(1);
          }

          // Load the bindings that ship prebuilt to prove they run on this OS.
          for (const name of ['sqlite3', '@duckdb/node-api']) {
            require(name);
            console.log(`loaded ${name}`);
          }
          console.log(`Native modules OK for ${target}.`);
          EOF

      - name: Package VSIX
        env:
          npm_config_include: prod
        run: npm run package -- --target ${{ matrix.target }}

      - name: Locate VSIX
        id: vsix
        run: |
          shopt -s nullglob
          files=(queryable-db-${{ matrix.target }}-*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one queryable-db-${{ matrix.target }}-*.vsix, found ${#files[@]}"
            ls -la
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "Built ${files[0]} ($(wc -c < "${files[0]}") bytes)"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.vsix.outputs.path }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 30
